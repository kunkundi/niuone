x-niuone-environment: &niuone-environment
  NIUONE_CONTAINER_DATA_DIR: /data
  NIUONE_CONTAINER_HOST: 0.0.0.0
  NIUONE_CONTAINER_PORT: "8787"
  DASHBOARD_ACCESS_LOG: "0"
  TZ: Asia/Shanghai

x-niuone-logging: &niuone-logging
  driver: local
  options:
    max-size: "5m"
    max-file: "3"
    compress: "true"

x-niuone-common: &niuone-common
  image: ${NIUONE_IMAGE:-niuone:local}
  build:
    context: .
    args:
      PYTHON_VERSION: "${PYTHON_VERSION:-3.11}"
      NIUONE_VERSION: "${NIUONE_VERSION:-dev}"
  init: true
  restart: unless-stopped
  stop_grace_period: 6m
  logging: *niuone-logging
  environment: *niuone-environment
  volumes:
    - niuone-data:/data

services:
  dashboard:
    <<: *niuone-common
    command: ["dashboard"]
    environment:
      <<: *niuone-environment
      NIUONE_BUNDLED_NEWSNOW_URL: http://newsnow:4444/api/s
    depends_on:
      newsnow:
        condition: service_started
    ports:
      - "${NIUONE_BIND_ADDRESS:-127.0.0.1}:${NIUONE_PORT:-8787}:8787"

  newsnow:
    image: ${NEWSNOW_IMAGE:-ghcr.io/ourongxing/newsnow:latest}
    restart: unless-stopped
    logging: *niuone-logging
    environment:
      HOST: 0.0.0.0
      PORT: "4444"
      NODE_ENV: production
      NODE_OPTIONS: --require=/etc/niuone/newsnow-network.cjs
      INIT_TABLE: "true"
      ENABLE_CACHE: "true"
      TZ: Asia/Shanghai
    volumes:
      - newsnow-data:/usr/app/.data
      - ./scripts/newsnow-network.cjs:/etc/niuone/newsnow-network.cjs:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4444/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  scheduler:
    <<: *niuone-common
    command: ["scheduler"]
    depends_on:
      dashboard:
        condition: service_healthy
    healthcheck:
      disable: true

volumes:
  niuone-data:
  newsnow-data:
